<!DOCTYPE html>
<html lang="ja" id="popup">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>obsidian-speakerdeck-clipper</title>
    <link rel="stylesheet" href="../src/style.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body id="popup-container">
    <div id="popup-header">
      <div id="template-container">
        <select id="template-select"></select>
      </div>
      <div class="popup-actions">
        <a href="#" id="open-in-tab" class="clickable-icon" title="タブで開く（長時間の解析向け）">
          <i data-icon="external-link"></i>
        </a>
        <a href="#" id="open-settings" class="clickable-icon" title="設定">
          <i data-icon="settings"></i>
        </a>
      </div>
    </div>

    <p class="error-message" hidden></p>

    <div class="clipper">
      <textarea id="note-name-field" rows="1" spellcheck="false"></textarea>

      <div class="metadata-properties-header">
        <span>プロパティ</span>
        <i data-icon="chevron-down"></i>
      </div>
      <div class="metadata-properties"></div>

      <div id="note-content-container">
        <textarea id="note-content-field" spellcheck="false" placeholder="「スライドを解析」を押すと、ここにノートの本文が入ります。"></textarea>
      </div>

      <div class="clipper-footer">
        <div id="progress" hidden>
          <div class="progress-bar"><div id="progress-fill"></div></div>
          <div id="progress-text"></div>
        </div>

        <div class="vault-path-container">
          <div id="vault-container" hidden>
            <select id="vault-select"></select>
          </div>
          <input id="path-name-field" type="text" placeholder="保存先フォルダ" />
        </div>

        <div class="action-buttons">
          <button id="clip-btn" class="mod-cta">スライドを解析</button>
          <div class="menu-btn">
            <button id="more-btn" title="その他の操作"><i data-icon="chevron-down"></i></button>
            <div class="menu" id="more-dropdown"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="../lib/pdf.js"></script>
    <script src="../lib/tesseract.min.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
